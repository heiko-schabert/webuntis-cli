version: "2"
linters:
  default: all
  disable:
    - depguard # no dependency policy; default list blocks this module's own dot-less path
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - godox
    - lll
    - revive
    - tagliatelle
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  fix: true
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
